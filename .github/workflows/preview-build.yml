# Fork-only preview build: unsigned Windows MSI + portable exe, no updater artifacts.
# Lives only on the build/* preview branch; never part of an upstream PR.
name: Preview Build (Windows)

on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Tests for the changes in this build (Antigravity usage import + pricing seed).
      - name: Run targeted backend tests
        shell: bash
        working-directory: src-tauri
        run: |
          mkdir -p ../dist
          export CC_SWITCH_TEST_HOME="$RUNNER_TEMP/cc-switch-test-home"
          mkdir -p "$CC_SWITCH_TEST_HOME"
          cargo test --lib -- session_usage_agy hydrogen

      - name: Build Tauri App (Windows, unsigned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Out-File -Encoding ascii no-updater.json
          pnpm tauri build --bundles msi -c no-updater.json

      - name: Upload preview build
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-preview-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/cc-switch.exe
          if-no-files-found: error
          retention-days: 7
